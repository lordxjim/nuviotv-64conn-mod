name: Patch & Build (256-conn dev)

# Applies nuviotv-256conn.patch to the official NuvioMedia/NuvioTV repository,
# verifies the patch invariants, builds the APK, and unit-tests the patched
# app AGAINST an unpatched baseline run of the same suite.
#
# The patch is authored against pristine upstream dev @ 48d6449 (same model as
# the 64-conn patch): commit 1 is the original 64-connection mod, commits 2-6
# are the 256 tier. One `git am` applies everything; no patch chaining and no
# dependency on the main branch's nuviotv-64conn.patch (this patch supersedes
# it).
#
# Job map:
#   patch-verify-build   apply + verify + assembleFullDebug -> APK artifact
#   unit-tests-patched   full unit test suite on the patched tree (tolerant)
#   unit-tests-baseline  full unit test suite on the unpatched tree (tolerant)
#   test-verdict         compares failed-test sets; red ONLY on real
#                        regressions (patch fails tests the baseline passes).
#
# Pre-existing upstream test failures fail on BOTH sides and are tolerated
# (upstream's own CI only runs com.nuvio.tv.updater.* for the same reason).
#
# Tested baseline (patch applies cleanly with git am --3way):
#   - dev  @ 48d6449  (default branch tip, the patch's authored base)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'NuvioTV ref to patch (branch / commit / tag)'
        required: false
        default: 'dev'
  push:
    branches: ['**']
    paths:
      - 'nuviotv-256conn.patch'
      - 'verify-patch.sh'
      - 'compare-tests.py'
      - '.github/workflows/patch-and-build.yml'
  pull_request:
    paths:
      - 'nuviotv-256conn.patch'
      - 'verify-patch.sh'
      - 'compare-tests.py'
      - '.github/workflows/patch-and-build.yml'

permissions:
  contents: read

concurrency:
  group: patch-build-256-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-verify-build:
    name: Apply 256-connection patch, verify, build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream NuvioTV (${{ inputs.upstream_ref || 'dev' }})
        uses: actions/checkout@v4
        with:
          repository: NuvioMedia/NuvioTV
          ref: ${{ inputs.upstream_ref || 'dev' }}
          # Full history so `git am --3way` can find base blobs when the
          # selected ref has drifted from the patch's authored base.
          fetch-depth: 0

      - name: Checkout mod repository (patch + verify script)
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Apply 256-connection patch
        run: |
          git config user.name "patch-ci"
          git config user.email "patch-ci@users.noreply.github.com"
          echo "UPSTREAM_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git am --3way mod/nuviotv-256conn.patch
          echo "Patched HEAD: $(git log --oneline -1)"

      - name: Verify patch invariants
        run: bash mod/verify-patch.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        run: |
          touch local.properties
          touch local.dev.properties

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      # Stamp the APK and artifact names with the OFFICIAL versionName from
      # app/build.gradle.kts (identical to what an official build of the same
      # ref reports in Settings) plus the pristine upstream base commit
      # (captured BEFORE the patch was applied), so every rerun shows which
      # official release the APK is based on.
      - name: Stamp official version into artifact names
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME=$(git describe --tags --abbrev=0 "$UPSTREAM_SHA" 2>/dev/null || echo unknown)
          fi
          APK_BASE="NuvioTV-${VERSION_NAME}-256conn-${UPSTREAM_SHA}"
          echo "APK_BASE=$APK_BASE" >> "$GITHUB_ENV"
          mv app/build/outputs/apk/full/debug/app-full-universal-debug.apk \
             "app/build/outputs/apk/full/debug/${APK_BASE}-full-universal-debug.apk"
          {
            echo "## Patched APK version stamp (256-conn dev)"
            echo "- Official versionName: **${VERSION_NAME}**"
            echo "- Pristine upstream base: ${UPSTREAM_SHA} (ref: ${{ inputs.upstream_ref || 'dev' }})"
            echo "- Patch: nuviotv-256conn.patch (6 commits: 64-conn mod + 256 tier)"
            echo "- Artifact: \`${APK_BASE}-full-debug-apk\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASE }}-full-debug-apk
          path: app/build/outputs/apk/full/debug/${{ env.APK_BASE }}-full-universal-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  unit-tests-patched:
    name: Unit tests (patched)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream NuvioTV (${{ inputs.upstream_ref || 'dev' }})
        uses: actions/checkout@v4
        with:
          repository: NuvioMedia/NuvioTV
          ref: ${{ inputs.upstream_ref || 'dev' }}
          fetch-depth: 0

      - name: Checkout mod repository (patch + verify script)
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Apply 256-connection patch
        run: |
          git config user.name "patch-ci"
          git config user.email "patch-ci@users.noreply.github.com"
          git am --3way mod/nuviotv-256conn.patch

      - name: Verify patch invariants
        run: bash mod/verify-patch.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        run: |
          touch local.properties
          touch local.dev.properties

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      # Tolerant on purpose: the verdict job decides red/green by comparing
      # against the baseline, so upstream's own failing tests do not mark the
      # patch red by themselves.
      - name: Run full unit test suite
        continue-on-error: true
        run: ./gradlew :app:testFullDebugUnitTest --stacktrace

      - name: Upload test results (XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-patched
          path: app/build/test-results/testFullDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test reports (HTML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-patched-html
          path: app/build/reports/tests/testFullDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  unit-tests-baseline:
    name: Unit tests (baseline, unpatched)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream NuvioTV (${{ inputs.upstream_ref || 'dev' }})
        uses: actions/checkout@v4
        with:
          repository: NuvioMedia/NuvioTV
          ref: ${{ inputs.upstream_ref || 'dev' }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        run: |
          touch local.properties
          touch local.dev.properties

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      # Same tolerance as the patched job: pre-existing upstream failures are
      # compared, not fatal.
      - name: Run full unit test suite (baseline)
        continue-on-error: true
        run: ./gradlew :app:testFullDebugUnitTest --stacktrace

      - name: Upload test results (XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-baseline
          path: app/build/test-results/testFullDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 7

  test-verdict:
    name: Test verdict (patched vs baseline)
    needs: [unit-tests-patched, unit-tests-baseline]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod repository (compare script)
        uses: actions/checkout@v4

      - name: Download patched test results
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: test-results-patched
          path: results/patched

      - name: Download baseline test results
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: test-results-baseline
          path: results/baseline

      # Exit code is preserved (regressions still turn the job red); the
      # verdict text is mirrored into the run summary so the outcome of the
      # tolerated exit-code-1 test steps is visible at a glance.
      - name: Compare and decide
        run: |
          set +e
          python3 compare-tests.py results/patched results/baseline > verdict.txt 2>&1
          VERDICT=$?
          set -e
          cat verdict.txt
          {
            echo "## Test verdict (patched vs baseline)"
            echo '```'
            cat verdict.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $VERDICT
